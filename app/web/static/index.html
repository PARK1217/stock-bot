<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stock-bot</title>
<style>
  :root{--bg:#0f1115;--card:#1a1d24;--line:#2a2f3a;--fg:#e6e9ef;--mut:#8b93a3;
        --up:#27c281;--down:#ff5c6c;--accent:#4c8dff;--warn:#ffb454;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px}
  header{display:flex;align-items:baseline;gap:16px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:18px;margin:0} .mut{color:var(--mut)} .badge{background:var(--card);
    border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px}
  .total{font-size:22px;font-weight:700;margin-left:auto}
  .wrap{padding:16px 20px;display:grid;gap:16px;grid-template-columns:1fr;max-width:1100px;margin:0 auto}
  @media(min-width:900px){.wrap{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .card h2{font-size:14px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:7px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th:first-child,td:first-child{text-align:left} th{color:var(--mut);font-weight:500;font-size:12px}
  tbody tr:hover{background:#20242d} .up{color:var(--up)} .down{color:var(--down)}
  .sym{font-weight:600} .pill{font-size:11px;padding:1px 6px;border-radius:4px;background:#222834;color:var(--mut)}
  .pill.al{background:#173a2c;color:var(--up)} .empty{padding:18px 14px;color:var(--mut)}
  button{background:#222834;color:var(--fg);border:1px solid var(--line);border-radius:6px;
    padding:4px 10px;cursor:pointer;font-size:12px} button:hover{border-color:var(--accent)}
  .bar{height:5px;background:#2a2f3a;border-radius:3px;overflow:hidden;min-width:46px;display:inline-block;vertical-align:middle}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .side-buy{color:var(--up)} .side-sell{color:var(--down)}
  @keyframes fl{from{background:#2b3550}to{background:transparent}} .flash{animation:fl .7s}
  .ses{font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;font-weight:600}
  .s-reg{background:#173a2c;color:#27c281} .s-pre{background:#3a3417;color:#ffd454}
  .s-aft{background:#3a2a17;color:#ffb454} .s-day{background:#17283a;color:#6fb3ff}
  .s-off{background:#262a33;color:#8b93a3}
  .live{font-size:11px;color:var(--up)} .live::before{content:"● ";animation:bl 2s infinite}
  @keyframes bl{50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <h1>📈 stock-bot</h1>
  <span class="badge" id="meta">…</span>
  <span class="live" id="live" title="10초마다 시세 갱신">LIVE</span>
  <span id="sess"></span>
  <button id="curtgl" onclick="toggleCur()" title="원화/달러 전환">₩</button>
  <span style="flex:1 1 100%;text-align:right;white-space:nowrap">
    <span class="total" id="total">—</span>
    <span id="rets" style="font-size:13px;margin-left:12px"></span>
  </span>
</header>
<div class="wrap">
  <div class="card span2">
    <h2>토스 포트폴리오 (미국) <span class="mut" id="pf-st"></span>
        <button onclick="loadAll()" style="float:right">새로고침</button></h2>
    <table><thead><tr><th>종목</th><th>수량</th><th>현재가</th><th>수익률</th><th>평가</th></tr></thead>
    <tbody id="pf"><tr><td class="empty" colspan="5">불러오는 중…</td></tr></tbody></table>
  </div>
  <div class="card">
    <h2>추세 스크리너 <span class="mut" id="scn-st">로딩…</span></h2>
    <table><thead><tr><th>종목</th><th>점수</th><th>1M</th><th>3M</th><th></th></tr></thead>
    <tbody id="scn"><tr><td class="empty" colspan="5">계산 중(최초 ~30초)…</td></tr></tbody></table>
  </div>
  <div class="card span2">
    <h2>📰 주요 이슈 요약 (보유 + 추세상위) <span class="mut" id="news-st"></span></h2>
    <div id="news"><div class="empty">불러오는 중… (최초 다소 걸림)</div></div>
  </div>
  <div class="card span2">
    <h2>🏦 한투 실계좌 (ISA·연금·소수점) <span class="mut" id="kis-st"></span></h2>
    <table><thead><tr><th>계좌·종목</th><th>수량</th><th>현재가</th><th>수익률</th><th>평가</th></tr></thead>
    <tbody id="kis"><tr><td class="empty" colspan="5">불러오는 중…</td></tr></tbody></table>
  </div>
  <div class="card span2">
    <h2>🧪 모의 자동매매 (전략 검증) <span class="mut" id="paper-st"></span></h2>
    <table><thead><tr><th>종목</th><th>수량</th><th>현재가</th><th>수익률</th><th>평가</th></tr></thead>
    <tbody id="paper"><tr><td class="empty" colspan="5">—</td></tr></tbody></table>
  </div>
  <div class="card">
    <h2>리밸런싱 제안</h2>
    <table><thead><tr><th>종목</th><th>방향</th><th>수량</th><th>사유</th></tr></thead>
    <tbody id="prop"><tr><td class="empty" colspan="4">—</td></tr></tbody></table>
  </div>
  <div class="card span2">
    <h2>예측 기록 <span class="mut" id="acc"></span></h2>
    <table><thead><tr><th>종목</th><th>기준가</th><th>상승확률</th><th>기대수익</th><th>상태</th><th>실제</th></tr></thead>
    <tbody id="pred"><tr><td class="empty" colspan="6">—</td></tr></tbody></table>
  </div>
</div>
<script>
const won=n=>n==null?'—':Math.round(n).toLocaleString()+'₩';
let CUR='KRW';
function toggleCur(){CUR=CUR==='KRW'?'USD':'KRW';document.getElementById('curtgl').textContent=CUR==='KRW'?'₩':'$';
  updateHeader();renderPortfolio();renderKis();renderPaper();}
function amt(krw){if(krw==null)return'';return CUR==='KRW'?Math.round(krw).toLocaleString()+'원':'$'+Math.round(krw/(ST.fx||1540)).toLocaleString();}
function samt(krw){if(krw==null)return'';return (krw>=0?'+':'')+amt(krw);}
function tzMin(tz){const d=new Date(new Date().toLocaleString('en-US',{timeZone:tz}));return [d.getDay(),d.getHours()*60+d.getMinutes()];}
function usSession(){const [d,m]=tzMin('America/New_York');  // ET 기준
  if(d===6) return ['미국 마감','s-off'];
  if(d===0&&m<20*60) return ['미국 마감','s-off'];
  if(d===5&&m>=20*60) return ['미국 마감','s-off'];
  if(m>=240&&m<570) return ['프리마켓','s-pre'];
  if(m>=570&&m<960) return ['정규장','s-reg'];
  if(m>=960&&m<1200) return ['애프터','s-aft'];
  return ['데이마켓','s-day'];}  // 20:00~04:00 ET = 한국 주간거래
function krSession(){const [d,m]=tzMin('Asia/Seoul');
  if(d===0||d===6) return ['한국 마감','s-off'];
  if(m>=540&&m<930) return ['한국 정규장','s-reg'];
  if(m>=480&&m<540) return ['한국 장전','s-pre'];
  if(m>=940&&m<960) return ['한국 시간외','s-aft'];
  return ['한국 마감','s-off'];}
function updateSessions(){
  const [us,uc]=usSession(),[kr,kc]=krSession();
  document.getElementById('sess').innerHTML=
    `<span class="ses ${uc}">🇺🇸 ${us}</span><span class="ses ${kc}">🇰🇷 ${kr}</span>`;}
const pct=n=>n==null?'—':(n>=0?'+':'')+n.toFixed(1)+'%';
const cls=n=>n==null?'':n>=0?'up':'down';
async function j(u){try{const r=await fetch(u);return await r.json()}catch(e){return null}}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function md(s){s=esc(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/^\s*[-*]\s+/gm,'• ').replace(/\n+/g,' ');
  return s;}

let ST={fx:1,cash:0,pos:[],daily:null,total_pnl:null,live_total:0};
let KIST={total:0,rate:null};
async function loadPortfolio(){
  const d=await j('/api/portfolio'); if(!d)return;
  ST.fx=d.fx; ST.cash=d.cash; ST.daily=d.daily_pnl_pct; ST.total_pnl=d.total_pnl_pct;
  ST.daily_amt=d.daily_pnl_amt_krw; ST.total_amt=d.total_pnl_amt_krw;
  ST.pos=(d.positions||[]).sort((a,b)=>b.value_krw-a.value_krw);
  document.getElementById('meta').textContent=`토스 · USDKRW ${Math.round(d.fx).toLocaleString()} · 현금 ${won(d.cash)}`;
  renderPortfolio();
}
function vkrw(p){return p.qty*p.price*(p.currency==='USD'?ST.fx:1)}
function renderPortfolio(){
  const rows=ST.pos.map(p=>
    `<tr data-sym="${p.symbol}"><td><span class="sym">${p.symbol}</span> <span class="mut">${p.name||''}</span></td>
     <td>${(+p.qty).toLocaleString(undefined,{maximumFractionDigits:4})}</td>
     <td>${(+p.price).toLocaleString()} ${p.currency}</td>
     <td class="${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</td>
     <td>${amt(vkrw(p))}</td></tr>`).join('');
  document.getElementById('pf').innerHTML=rows||'<tr><td class="empty" colspan=5>보유 없음</td></tr>';
  ST.live_total=(ST.cash||0)+ST.pos.reduce((s,p)=>s+vkrw(p),0);
  document.getElementById('pf-st').innerHTML='총 '+amt(ST.live_total)+
    (ST.total_pnl!=null?` · 전체 <span class="${cls(ST.total_pnl)}">${pct(ST.total_pnl)}${ST.total_amt!=null?' ('+samt(ST.total_amt)+')':''}</span>`:'')+
    (ST.daily!=null?` · 오늘 <span class="${cls(ST.daily)}">${pct(ST.daily)}${ST.daily_amt!=null?' ('+samt(ST.daily_amt)+')':''}</span>`:'');
  updateHeader();
}
function updateHeader(){
  const total=(ST.live_total||0)+(KIST.total||0);
  document.getElementById('total').textContent='총 '+amt(total);
  const parts=[];
  if(ST.daily!=null) parts.push(`오늘 <b class="${cls(ST.daily)}">${pct(ST.daily)}${ST.daily_amt!=null?' ('+samt(ST.daily_amt)+')':''}</b>`);
  const tcost=(ST.total_pnl!=null&&ST.live_total)?ST.live_total/(1+ST.total_pnl/100):ST.live_total;
  const kcost=(KIST.rate!=null&&KIST.total)?KIST.total/(1+KIST.rate/100):KIST.total;
  const cost=tcost+kcost;
  if(cost){const r=(total/cost-1)*100; const a=(ST.total_amt||0)+(KIST.total_amt||0);
    parts.push(`전체 <b class="${cls(r)}">${pct(r)} (${samt(a)})</b>`);}
  document.getElementById('rets').innerHTML=parts.join(' &nbsp;·&nbsp; ');
}
async function pollQuotes(){
  if(!ST.pos.length)return;
  const q=await j('/api/quotes?symbols='+ST.pos.map(p=>p.symbol).join(','));
  if(!q)return; const chg=new Set();
  ST.pos.forEach(p=>{const np=q[p.symbol]; if(np&&Math.abs(np-p.price)>1e-9){
    p.price=np; p.pnl_pct=(np-p.avg_price)/p.avg_price*100; chg.add(p.symbol);}});
  if(chg.size){renderPortfolio(); chg.forEach(s=>{
    const r=document.querySelector(`#pf tr[data-sym="${s}"]`);
    if(r){r.classList.add('flash');setTimeout(()=>r.classList.remove('flash'),700);}});}
}
async function loadScreen(){
  const d=await j('/api/screen'); const st=document.getElementById('scn-st');
  if(!d){st.textContent='실패';return} st.textContent=d.length+'종';
  const mx=Math.max(...d.map(r=>r.score),1);
  document.getElementById('scn').innerHTML=d.map(r=>
    `<tr><td><span class="sym">${r.symbol}</span> ${r.trend_aligned?'<span class="pill al">정배열</span>':''}</td>
     <td><span class="bar"><i style="width:${Math.max(0,r.score/mx*100)}%"></i></span> ${r.score}</td>
     <td class="${cls(r.ret_1m)}">${pct(r.ret_1m)}</td>
     <td class="${cls(r.ret_3m)}">${pct(r.ret_3m)}</td><td></td></tr>`).join('');
  window.SCN=d; loadNews();
}
async function loadNews(){
  const holds=(ST.pos||[]).slice(0,6).map(p=>p.symbol);
  const top=(window.SCN||[]).slice(0,5).map(r=>r.symbol);
  const syms=[...new Set([...holds,...top])];
  if(!syms.length)return;
  document.getElementById('news-st').textContent='로딩…';
  const d=await j('/api/news?symbols='+syms.join(','));
  if(!d){document.getElementById('news-st').textContent='실패';return}
  document.getElementById('news-st').textContent=d.length+'종';
  document.getElementById('news').innerHTML=d.map(n=>{
    const c=n.score>0.05?'up':(n.score<-0.05?'down':'mut');
    return `<div style="padding:7px 14px;border-bottom:1px solid var(--line)">
      <span class="${c}">●</span> <span class="sym">${n.symbol}</span>
      <span class="mut" style="font-size:13px"> — ${md(n.summary||'-')}</span></div>`;}).join('');
}
async function loadProposals(){
  const d=await j('/api/proposals'); const b=document.getElementById('prop');
  const open=(d||[]).filter(p=>p.status==='pending');
  b.innerHTML=open.length?open.map(p=>
    `<tr><td class="sym">${p.symbol}</td><td class="side-${p.side}">${p.side.toUpperCase()}</td>
     <td>${(+p.qty).toLocaleString(undefined,{maximumFractionDigits:4})}</td>
     <td class="mut">${p.reason||''}</td></tr>`).join('')
    :'<tr><td class="empty" colspan=4>대기 중 제안 없음</td></tr>';
}
async function loadPred(){
  const [d,a]=await Promise.all([j('/api/predictions'),j('/api/accuracy')]);
  if(a&&a.evaluated)document.getElementById('acc').textContent=
    `· 방향적중 ${Math.round(a.dir_acc*100)}% / 범위 ${Math.round(a.band_acc*100)}% (n=${a.evaluated})`;
  const b=document.getElementById('pred');
  b.innerHTML=(d&&d.length)?d.slice(0,12).map(p=>
    `<tr><td class="sym">${p.symbol}</td><td>${(+p.base_price).toLocaleString()}</td>
     <td>${Math.round(p.prob_up*100)}%</td><td class="${cls(p.exp_return)}">${pct(p.exp_return)}</td>
     <td>${p.status}</td><td class="${cls(p.actual_return)}">${p.actual_return!=null?pct(p.actual_return):'—'}</td></tr>`).join('')
    :'<tr><td class="empty" colspan=6>예측 기록 없음 (스케줄 가동 후 누적)</td></tr>';
}
let PST=null;
async function loadPaper(){const d=await j('/api/paper'); if(!d)return; PST=d; renderPaper();}
function renderPaper(){
  const d=PST; if(!d)return; const st=document.getElementById('paper-st');
  st.innerHTML=`총 ${amt(d.total)} `+(d.ret_pct!=null?`<span class="${cls(d.ret_pct)}">수익률 ${pct(d.ret_pct)}</span>`:'(시작 전)');
  const b=document.getElementById('paper');
  b.innerHTML=(d.positions&&d.positions.length)?d.positions.slice().sort((a,b)=>b.value_krw-a.value_krw).map(p=>
    `<tr><td><span class="pill ${p.market==='US'?'al':''}">${p.market}</span> <span class="sym">${p.symbol}</span> <span class="mut">${p.name||''}</span></td>
     <td>${(+p.qty).toLocaleString(undefined,{maximumFractionDigits:2})}</td><td>${(+p.price).toLocaleString()}</td>
     <td class="${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</td><td>${amt(p.value_krw)}</td></tr>`).join('')
    :`<tr><td class="empty" colspan=5>${d.error?'조회 오류':'장중 자동매매 시작 후 채워짐 (현금 '+amt(d.cash)+')'}</td></tr>`;
}
async function loadKis(){
  const d=await j('/api/kis'); if(!d)return;
  KIST.data=d; KIST.total=d.total; KIST.rate=d.total_pnl_pct; KIST.total_amt=d.total_pnl_amt_krw;
  updateHeader(); renderKis();
}
function renderKis(){
  const d=KIST.data; if(!d)return;
  document.getElementById('kis-st').innerHTML='총 '+amt(d.total)+
    (d.total_pnl_pct!=null?` · <span class="${cls(d.total_pnl_pct)}">${pct(d.total_pnl_pct)}</span>`:'');
  const groups={}; (d.positions||[]).forEach(p=>{(groups[p.account]=groups[p.account]||[]).push(p)});
  const icon={'ISA':'🟦','연금':'🟪','소수점':'🟩'}; let html='';
  ['ISA','연금','소수점'].forEach(acc=>{
    const ps=groups[acc]; if(!ps||!ps.length)return;
    const sub=ps.reduce((s,p)=>s+p.value_krw,0);
    const cost=ps.reduce((s,p)=>s+p.value_krw/(1+p.pnl_pct/100),0);
    const rr=cost?(sub/cost-1)*100:0;
    html+=`<tr style="background:#222834"><td><b>${icon[acc]||''} ${acc}</b> <span class="mut">${ps.length}종</span></td>
      <td colspan=2></td><td class="${cls(rr)}">${pct(rr)}</td><td><b>${amt(sub)}</b></td></tr>`;
    ps.sort((a,b)=>b.value_krw-a.value_krw).forEach(p=>{
      html+=`<tr><td style="padding-left:26px"><span class="sym">${p.symbol}</span> <span class="mut">${p.name||''}</span></td>
        <td>${(+p.qty).toLocaleString(undefined,{maximumFractionDigits:2})}</td>
        <td>${(+p.price).toLocaleString()} ${p.currency==='USD'?'$':''}</td>
        <td class="${cls(p.pnl_pct)}">${pct(p.pnl_pct)}</td><td>${amt(p.value_krw)}</td></tr>`;});
  });
  document.getElementById('kis').innerHTML=html||'<tr><td class="empty" colspan=5>보유 없음</td></tr>';
}
function loadAll(){loadPortfolio();loadKis();loadProposals();loadPred();loadPaper();loadScreen();}
loadAll(); updateSessions();
setInterval(updateSessions,30000);                              // 시장 세션 표시
setInterval(pollQuotes,10000);                                   // 10초 라이브 시세
setInterval(()=>{loadPortfolio();loadKis();loadProposals();loadPred();loadPaper();},60000);  // 1분 전체
</script>
</body>
</html>
